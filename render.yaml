services:
  - type: web
    name: supplyflow-api
    runtime: python
    plan: free
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    # Upgrade applies versioned schema changes only; synthetic seeding remains manual.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /api/v1/ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: demo
      - key: IS_SYNTHETIC_DATA_ONLY
        value: "true"
      - key: DEMO_READ_ONLY_MODE
        value: "true"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "1"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "60"
      - key: DATABASE_URL
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: supplyflow-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: SUPPLYFLOW_API_ORIGIN
        sync: false
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
