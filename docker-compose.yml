services:
  # ----------------------------------------------------------------------------
  # PostgreSQL + PostGIS Spatial Database
  # ----------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: supplyflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplyflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-supplyflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: supplyflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PROJECT_NAME: ${PROJECT_NAME:-SupplyFlow}
      DEMO_THEATER_LABEL: ${DEMO_THEATER_LABEL:-"DEMONSTRATION THEATER — SYNTHETIC LOGISTICS NETWORK"}
      IS_SYNTHETIC_DATA_ONLY: ${IS_SYNTHETIC_DATA_ONLY:-True}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-supplyflow}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-supplyflow}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-supplyflow}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # Next.js Frontend Dashboard
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: supplyflow-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXT_PUBLIC_DEMO_THEATER_LABEL: ${DEMO_THEATER_LABEL:-"DEMONSTRATION THEATER — SYNTHETIC LOGISTICS NETWORK"}
      NEXT_PUBLIC_IS_SYNTHETIC_DATA: "true"
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
